<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亦起跑-马拉松清单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #eef1f6;
            color: #1f2430;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(28, 39, 68, 0.08);
            padding: 22px 22px 28px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .logo {
            width: 84px;
            height: 84px;
            object-fit: contain;
            flex-shrink: 0;
        }

        h1 {
            font-size: 26px;
            line-height: 1.25;
            font-weight: 700;
        }

        .race {
            border: 1px solid #e6eaf2;
            background: #f7f9fc;
            border-radius: 10px;
            padding: 6px 8px 6px;
            margin-bottom: 12px;
        }

        .race-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .race-fields {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .race-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #4d5668;
        }

        .race-controls input,
        .race-controls select {
            font-size: 14px;
            padding: 4px 8px;
            border: 1px solid #d5dbe6;
            border-radius: 8px;
            background: #fff;
            color: #1f2430;
        }

        .hourly {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start;
            gap: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .hour {
            flex: 0 0 auto;
            text-align: center;
            background: #fff;
            border-radius: 6px;
            padding: 3px 6px;
            line-height: 1.15;
        }

        .hour-time {
            font-size: 14px;
            color: #667085;
        }

        .hour-icon {
            font-size: 22px;
            line-height: 1.1;
        }

        .hour-temp {
            font-size: 16px;
            font-weight: 650;
        }

        .hour-rain {
            font-size: 13px;
            color: #6d7c93;
        }

        .weather-note {
            flex: 1;
            font-size: 12px;
            color: #8b93a3;
            text-align: center;
            padding: 2px 0;
            white-space: nowrap;
        }

        .export-row {
            display: flex;
            gap: 8px;
            margin: 0 0 12px;
        }

        .user-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .user-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        #sessionBar {
            margin-left: auto;
            flex-shrink: 0;
            gap: 6px;
        }

        #sessionBar .user-status {
            min-height: 0;
            font-size: 14px;
        }

        #logoutBtn {
            padding: 4px 10px;
            font-size: 14px;
        }

        .user-section select,
        .user-section input,
        .add-category input,
        .add-item-row input {
            font-size: 18px;
            padding: 7px 10px;
            border: 1px solid #d5dbe6;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }

        .user-section select:focus,
        .user-section input:focus,
        .add-category input:focus,
        .add-item-row input:focus {
            border-color: #3d6dff;
        }

        .user-status {
            font-size: 15px;
            color: #5c6578;
            min-height: 1.2em;
        }

        .user-status.error {
            color: #c5374a;
        }

        .user-status.ok {
            color: #1f9d55;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .btn {
            font-size: 16px;
            padding: 7px 12px;
            border: none;
            border-radius: 8px;
            color: #fff;
            background: linear-gradient(135deg, #e23b4a, #3d6dff);
        }

        .btn-danger {
            background: #e23b4a;
        }

        .category {
            margin-bottom: 12px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #e23b4a, #3d6dff);
            color: #fff;
            border-radius: 10px;
            padding: 7px 12px;
            margin-bottom: 4px;
        }

        .category-name {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 6px;
            border-radius: 8px;
        }

        .item:hover {
            background: #f4f6fb;
        }

        .checkbox {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 3px solid #e23b4a;
            background: transparent;
            color: transparent;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox.checked {
            background: #1f9d55;
            border-color: #1f9d55;
            color: #fff;
        }

        .item-content {
            flex: 1;
            font-size: 20px;
            line-height: 1.25;
        }

        .delete-item-btn,
        .delete-category-btn {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #c5374a;
            font-size: 15px;
            padding: 2px 4px;
        }

        .delete-category-btn {
            color: #fff;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            padding: 3px 8px;
        }

        .add-item-row,
        .add-category {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 2px;
        }

        .add-item-row input,
        .add-category input {
            flex: 1;
            min-width: 0;
        }

        .add-category {
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            color: #8b93a3;
            padding: 28px 10px 18px;
        }

        .empty-state h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #5c6578;
        }

        .empty-state p {
            font-size: 16px;
            line-height: 1.35;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
        }

        .admin-user .item-content {
            font-size: 20px;
        }

        .admin-edit {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 8px 8px 8px;
        }

        .admin-edit input {
            font-size: 16px;
            padding: 6px 8px;
            border: 1px solid #d5dbe6;
            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 720px) {
            .container {
                padding: 16px 12px 22px;
            }

            h1 {
                font-size: 22px;
            }

            .logo {
                width: 68px;
                height: 68px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img class="logo" src="assets/logo.png" alt="亦起跑跑团">
            <div>
                <h1>亦起跑-马拉松清单</h1>
            </div>
        </header>

        <section class="race" id="raceSection">
            <div class="race-controls">
                <div class="race-fields">
                <label>跑马日期
                    <input type="date" id="raceDate" value="2026-10-25">
                </label>
                <label>城区
                    <select id="districtSelect">
                        <option value="北京东城区">北京东城区</option>
                        <option value="北京西城区">北京西城区</option>
                        <option value="北京朝阳区">北京朝阳区</option>
                        <option value="北京海淀区">北京海淀区</option>
                        <option value="北京丰台区">北京丰台区</option>
                        <option value="北京石景山区">北京石景山区</option>
                        <option value="北京门头沟区">北京门头沟区</option>
                        <option value="北京房山区" selected>北京房山区</option>
                        <option value="北京通州区">北京通州区</option>
                        <option value="北京顺义区">北京顺义区</option>
                        <option value="北京昌平区">北京昌平区</option>
                        <option value="北京大兴区">北京大兴区</option>
                        <option value="北京怀柔区">北京怀柔区</option>
                        <option value="北京平谷区">北京平谷区</option>
                        <option value="北京密云区">北京密云区</option>
                        <option value="北京延庆区">北京延庆区</option>
                    </select>
                </label>
                </div>
                <div class="user-row hidden" id="sessionBar">
                    <span class="user-status ok" id="sessionName"></span>
                    <button type="button" class="btn" id="logoutBtn">退出</button>
                </div>
            </div>
            <div class="hourly" id="hourly">
                <p class="weather-note">正在读取当天 6:00–12:00 预报</p>
            </div>
        </section>

        <div class="export-row hidden" id="exportRow">
            <button type="button" class="btn" id="pdfBtn">保存 PDF</button>
            <button type="button" class="btn" id="jpgBtn">保存图片</button>
        </div>

        <div class="user-section" id="authPanel">
            <div class="user-row">
                <select id="userSelect">
                    <option value="">选择已有用户</option>
                </select>
                <input type="password" id="loginPassword" placeholder="输入密码进入" autocomplete="current-password">
                <button type="button" class="btn" id="loginBtn">进入</button>
                <button type="button" class="btn btn-danger" id="deleteUserBtn">删除用户</button>
            </div>
            <div class="user-row">
                <input type="text" id="newUserName" placeholder="新用户名" autocomplete="username">
                <input type="password" id="newUserPassword" placeholder="设置密码" autocomplete="new-password">
                <input type="password" id="newUserPassword2" placeholder="确认密码" autocomplete="new-password">
                <button type="button" class="btn" id="addUserBtn">注册用户</button>
            </div>
            <p class="user-status" id="userStatus"></p>
        </div>

        <div id="checklist"></div>

        <div class="add-category hidden" id="addCategoryRow">
            <input type="text" id="newCategoryName" placeholder="新类别名称" autocomplete="off">
            <button type="button" class="btn" id="addCategoryBtn">添加类别</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "running_checklist_users";
        const RACE_KEY = "running_checklist_race";

        const DISTRICTS = {
            "北京东城区": [39.9288, 116.416],
            "北京西城区": [39.9123, 116.3659],
            "北京朝阳区": [39.9215, 116.4432],
            "北京海淀区": [39.9593, 116.2982],
            "北京丰台区": [39.8585, 116.2867],
            "北京石景山区": [39.9063, 116.2229],
            "北京门头沟区": [39.9404, 116.1017],
            "北京房山区": [39.7355, 116.1433],
            "北京通州区": [39.9097, 116.6564],
            "北京顺义区": [40.1302, 116.6548],
            "北京昌平区": [40.2207, 116.2312],
            "北京大兴区": [39.7268, 116.3414],
            "北京怀柔区": [40.316, 116.6319],
            "北京平谷区": [40.1406, 117.1214],
            "北京密云区": [40.3769, 116.8431],
            "北京延庆区": [40.4566, 115.9748]
        };

        const defaultCategories = [
            {
                name: "穿戴衣物",
                items: [
                    { name: "速干半袖（跑团团服） - 不要使用棉线材质半袖", checked: false },
                    { name: "运动短裤 - 速干短裤、或者防磨短裤", checked: false },
                    { name: "跑步袜", checked: false },
                    { name: "跑鞋 - 不要用新鞋、系双重鞋带，防止松脱", checked: false },
                    { name: "遮阳帽 - 遮阳、吸汗", checked: false },
                    { name: "一次性雨衣 – 到达起跑处开始穿用于防冻，开始起跑后丢在马路边", checked: false },
                    { name: "Sports Bra（女生）", checked: false },
                    { name: "头绳（女生）", checked: false }
                ]
            },
            {
                name: "穿戴物品",
                items: [
                    { name: "太阳镜", checked: false },
                    { name: "运动手表 - 提前充电，记录心率、配速及成绩", checked: false },
                    { name: "护腕 - 擦汗", checked: false },
                    { name: "腰包、跑步背心 - 用于放手机、能量棒、盐丸等", checked: false },
                    { name: "存包袋以及存包卡（在组委会的发放的物资包中，若不存包，可以不带）", checked: false }
                ]
            },
            {
                name: "涂抹及食品",
                items: [
                    { name: "防晒霜", checked: false },
                    { name: "凡士林 - 腋下、乳头、裆部、脚步易磨部位（容易出血 - 全马必须）", checked: false },
                    { name: "肌肉贴 - 可选", checked: false },
                    { name: "能量胶 – 跑前及10公里处吃", checked: false },
                    { name: "盐丸 – 10公里处吃", checked: false }
                ]
            },
            {
                name: "重要物品",
                items: [
                    { name: "号码簿 - 提前固定在运动衣上", checked: false },
                    { name: "手机 - 提前充好电", checked: false },
                    { name: "充电宝 - 若需要", checked: false }
                ]
            }
        ];

        const WEATHER_ICONS = {
            0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
            45: "🌫️", 48: "🌫️",
            51: "🌦️", 53: "🌦️", 55: "🌧️",
            61: "🌦️", 63: "🌧️", 65: "🌧️",
            71: "🌨️", 73: "❄️", 75: "❄️",
            80: "🌦️", 81: "🌧️", 82: "🌧️",
            95: "⛈️", 96: "⛈️", 99: "⛈️"
        };

        let users = {};
        let currentUser = "";
        let token = "";

        const checklistEl = document.getElementById("checklist");
        const userSelect = document.getElementById("userSelect");
        const addCategoryRow = document.getElementById("addCategoryRow");
        const userStatus = document.getElementById("userStatus");

        function esc(text) {
            return String(text).replace(/[&<>"']/g, (ch) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[ch]));
        }

        function setStatus(text, type) {
            userStatus.textContent = text || "";
            userStatus.className = "user-status" + (type ? ` ${type}` : "");
        }

        const ADMIN_NAME = "admin";

        function currentCategories() {
            return currentUser && users[currentUser] ? users[currentUser].categories : null;
        }

        function isAdminUser() {
            return Boolean(currentUser && users[currentUser] && users[currentUser].role === "admin");
        }

        async function api(path, options = {}) {
            const headers = { "Content-Type": "application/json" };
            if (token) headers.Authorization = `Bearer ${token}`;
            const response = await fetch(path, {
                method: options.method || "GET",
                headers,
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "请求失败");
            return data;
        }

        function applyUserList(list) {
            const next = {};
            list.forEach((user) => {
                const previous = users[user.username];
                next[user.username] = {
                    role: user.role,
                    categories: previous && previous.categories ? previous.categories : null
                };
            });
            if (currentUser && next[currentUser] && users[currentUser]) {
                next[currentUser].categories = users[currentUser].categories;
                next[currentUser].role = users[currentUser].role || next[currentUser].role;
            }
            users = next;
        }

        async function refreshUserList() {
            const data = await api("/api/users");
            applyUserList(data.users || []);
            updateUserSelect();
        }

        async function migrateLocalUsers() {
            if (localStorage.getItem("running_checklist_migrated")) return;
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                localStorage.setItem("running_checklist_migrated", "1");
                return;
            }
            let stored = {};
            try {
                stored = JSON.parse(raw) || {};
            } catch (error) {
                stored = {};
            }
            const payload = {};
            Object.keys(stored).forEach((name) => {
                const value = stored[name];
                if (Array.isArray(value)) {
                    payload[name] = { passwordHash: "", categories: value };
                } else if (value && value.passwordHash) {
                    payload[name] = {
                        passwordHash: value.passwordHash,
                        categories: value.categories || []
                    };
                }
            });
            await api("/api/migrate", { method: "POST", body: { users: payload } });
            localStorage.setItem("running_checklist_migrated", "1");
        }

        async function persistCategories() {
            if (!currentUser || isAdminUser()) return;
            await api("/api/me", { method: "PUT", body: { categories: users[currentUser].categories } });
        }

        function updateUserSelect() {
            const names = Object.keys(users);
            userSelect.innerHTML = '<option value="">选择已有用户</option>' + names.map((name) => {
                const selected = name === currentUser ? " selected" : "";
                return `<option value="${esc(name)}"${selected}>${esc(name)}</option>`;
            }).join("");
        }

        function updateSessionBar() {
            const loggedIn = Boolean(currentUser && users[currentUser]);
            document.getElementById("authPanel").classList.toggle("hidden", loggedIn);
            document.getElementById("sessionBar").classList.toggle("hidden", !loggedIn);
            document.getElementById("sessionName").textContent = loggedIn ? currentUser : "";
        }

        function renderAdmin() {
            const names = Object.keys(users).filter((name) => name !== ADMIN_NAME);
            const rows = names.length ? names.map((name) => `
                <div class="admin-user">
                    <span class="item-content">${esc(name)}</span>
                    <button type="button" class="btn" data-action="edit-user" data-name="${esc(name)}">修改</button>
                    <button type="button" class="delete-item-btn" data-action="remove-user" data-name="${esc(name)}">删除</button>
                </div>
                <div class="admin-edit hidden" data-edit="${esc(name)}">
                    <input type="text" data-field="name" value="${esc(name)}" placeholder="新用户名">
                    <input type="password" data-field="password" placeholder="新密码，不改可留空" autocomplete="new-password">
                    <button type="button" class="btn" data-action="save-user" data-name="${esc(name)}">保存</button>
                </div>
            `).join("") : `<div class="empty-state"><p>还没有其他用户</p></div>`;
            checklistEl.innerHTML = `
                <section class="category">
                    <div class="category-header">
                        <span class="category-name">用户列表</span>
                        <button type="button" class="delete-category-btn" data-action="admin-logout">退出</button>
                    </div>
                    ${userStatus.textContent ? `<p class="user-status ${userStatus.classList.contains("error") ? "error" : "ok"}">${esc(userStatus.textContent)}</p>` : ""}
                    ${rows}
                </section>`;
        }

        function renderChecklist() {
            const categories = currentCategories();
            updateSessionBar();
            document.querySelector(".race-fields").classList.toggle("hidden", isAdminUser());
            document.getElementById("hourly").classList.toggle("hidden", isAdminUser());
            if (isAdminUser()) {
                addCategoryRow.classList.add("hidden");
                document.getElementById("exportRow").classList.add("hidden");
                renderAdmin();
                return;
            }
            document.getElementById("exportRow").classList.toggle("hidden", !categories);
            addCategoryRow.classList.toggle("hidden", !categories);
            if (!categories) {
                checklistEl.innerHTML = `
                    <div class="empty-state">
                        <h2>请注册或输入密码进入</h2>
                        <p>每位跑者自己设密码，单独维护类别、物品和勾选</p>
                    </div>`;
                return;
            }

            checklistEl.innerHTML = categories.map((category, catIndex) => `
                <section class="category">
                    <div class="category-header">
                        <span class="category-name">${esc(category.name)}</span>
                        <button type="button" class="delete-category-btn" data-action="delete-category" data-cat="${catIndex}">删除类别</button>
                    </div>
                    ${category.items.map((item, itemIndex) => `
                        <div class="item">
                            <button type="button" class="checkbox${item.checked ? " checked" : ""}" data-action="toggle" data-cat="${catIndex}" data-item="${itemIndex}" aria-pressed="${item.checked}" aria-label="${item.checked ? "已准备" : "未准备"}">${item.checked ? "✓" : ""}</button>
                            <span class="item-content">${esc(item.name)}</span>
                            <button type="button" class="delete-item-btn" data-action="delete-item" data-cat="${catIndex}" data-item="${itemIndex}">删除</button>
                        </div>
                    `).join("")}
                    <div class="add-item-row">
                        <input type="text" placeholder="添加物品，注释写在同一行" data-cat="${catIndex}" autocomplete="off">
                        <button type="button" class="btn" data-action="add-item" data-cat="${catIndex}">添加</button>
                    </div>
                </section>
            `).join("");
        }

        async function addUser() {
            const nameInput = document.getElementById("newUserName");
            const passInput = document.getElementById("newUserPassword");
            const pass2Input = document.getElementById("newUserPassword2");
            const name = nameInput.value.trim();
            const password = passInput.value;
            const password2 = pass2Input.value;

            if (!name) {
                setStatus("请填写用户名", "error");
                return;
            }
            if (name === ADMIN_NAME || users[name]) {
                setStatus("用户名已存在", "error");
                return;
            }
            if (!password) {
                setStatus("请设置密码", "error");
                return;
            }
            if (password !== password2) {
                setStatus("两次密码不一致", "error");
                return;
            }

            try {
                const data = await api("/api/register", { method: "POST", body: { username: name, password } });
                token = data.token;
                currentUser = name;
                users[name] = { role: "user", categories: data.categories };
                nameInput.value = "";
                passInput.value = "";
                pass2Input.value = "";
                document.getElementById("loginPassword").value = "";
                updateUserSelect();
                setStatus(`已进入：${name}`, "ok");
                renderChecklist();
            } catch (error) {
                setStatus(error.message, "error");
            }
        }

        async function loginUser() {
            const name = userSelect.value;
            const password = document.getElementById("loginPassword").value;
            if (!name) {
                setStatus("请先选择用户", "error");
                return;
            }
            if (!password) {
                setStatus("请输入密码", "error");
                return;
            }

            try {
                const data = await api("/api/login", { method: "POST", body: { username: name, password } });
                token = data.token;
                currentUser = name;
                users[name] = { role: data.user.role, categories: data.categories };
                document.getElementById("loginPassword").value = "";
                updateUserSelect();
                setStatus(`已进入：${name}`, "ok");
                renderChecklist();
            } catch (error) {
                setStatus(error.message, "error");
            }
        }

        function logoutUser() {
            currentUser = "";
            token = "";
            userSelect.value = "";
            document.getElementById("loginPassword").value = "";
            setStatus("已退出");
            renderChecklist();
        }

        async function deleteUser() {
            const name = currentUser || userSelect.value;
            const password = document.getElementById("loginPassword").value;
            if (!name || !users[name]) {
                setStatus("请选择要删除的用户", "error");
                return;
            }
            if (name === ADMIN_NAME) {
                setStatus("不能删除超级用户", "error");
                return;
            }
            if (!password) {
                setStatus("删除前请输入该用户密码", "error");
                return;
            }
            try {
                await api("/api/delete-account", { method: "POST", body: { username: name, password } });
                delete users[name];
                if (currentUser === name) {
                    currentUser = "";
                    token = "";
                }
                document.getElementById("loginPassword").value = "";
                updateUserSelect();
                setStatus(`已删除用户：${name}`);
                renderChecklist();
            } catch (error) {
                setStatus(error.message, "error");
            }
        }

        async function addCategory() {
            const input = document.getElementById("newCategoryName");
            const name = input.value.trim();
            const categories = currentCategories();
            if (!name || !categories) return;
            categories.push({ name, items: [] });
            input.value = "";
            try {
                await persistCategories();
                renderChecklist();
            } catch (error) {
                setStatus(error.message, "error");
            }
        }

        async function addItem(catIndex, input) {
            const name = input.value.trim();
            const categories = currentCategories();
            if (!name || !categories || !categories[catIndex]) return;
            categories[catIndex].items.push({ name, checked: false });
            try {
                await persistCategories();
                renderChecklist();
            } catch (error) {
                setStatus(error.message, "error");
            }
        }

        async function saveManagedUser(oldName) {
            const box = checklistEl.querySelector(`[data-edit="${CSS.escape(oldName)}"]`);
            if (!box || !users[oldName] || oldName === ADMIN_NAME) return;
            const newName = box.querySelector('[data-field="name"]').value.trim();
            const newPassword = box.querySelector('[data-field="password"]').value;
            if (!newName) {
                setStatus("请填写用户名", "error");
                return;
            }
            if (newName !== oldName && (newName === ADMIN_NAME || users[newName])) {
                setStatus("用户名已存在", "error");
                return;
            }
            try {
                await api("/api/users", {
                    method: "PATCH",
                    body: { oldName, newName, newPassword }
                });
                await refreshUserList();
                setStatus(`已更新：${newName}`, "ok");
                renderAdmin();
            } catch (error) {
                setStatus(error.message, "error");
                renderAdmin();
            }
        }

        checklistEl.addEventListener("click", async (event) => {
            const target = event.target.closest("[data-action]");
            if (target && isAdminUser()) {
                const name = target.dataset.name;
                if (target.dataset.action === "admin-logout") {
                    logoutUser();
                } else if (target.dataset.action === "edit-user") {
                    const box = checklistEl.querySelector(`[data-edit="${CSS.escape(name)}"]`);
                    if (box) box.classList.toggle("hidden");
                } else if (target.dataset.action === "remove-user") {
                    if (name && name !== ADMIN_NAME && users[name]) {
                        try {
                            await api("/api/users", { method: "DELETE", body: { username: name } });
                            delete users[name];
                            updateUserSelect();
                            setStatus(`已删除用户：${name}`);
                            renderAdmin();
                        } catch (error) {
                            setStatus(error.message, "error");
                            renderAdmin();
                        }
                    }
                } else if (target.dataset.action === "save-user") {
                    saveManagedUser(name);
                }
                return;
            }
            const categories = currentCategories();
            if (!target || !categories) return;
            const catIndex = Number(target.dataset.cat);
            const itemIndex = Number(target.dataset.item);
            const action = target.dataset.action;

            if (action === "toggle") {
                const item = categories[catIndex].items[itemIndex];
                item.checked = !item.checked;
                try {
                    await persistCategories();
                    renderChecklist();
                } catch (error) {
                    item.checked = !item.checked;
                    setStatus(error.message, "error");
                }
            } else if (action === "delete-item") {
                const removed = categories[catIndex].items.splice(itemIndex, 1);
                try {
                    await persistCategories();
                    renderChecklist();
                } catch (error) {
                    categories[catIndex].items.splice(itemIndex, 0, ...removed);
                    setStatus(error.message, "error");
                }
            } else if (action === "delete-category") {
                const removed = categories.splice(catIndex, 1);
                try {
                    await persistCategories();
                    renderChecklist();
                } catch (error) {
                    categories.splice(catIndex, 0, ...removed);
                    setStatus(error.message, "error");
                }
            } else if (action === "add-item") {
                const input = checklistEl.querySelector(`.add-item-row input[data-cat="${catIndex}"]`);
                if (input) addItem(catIndex, input);
            }
        });

        checklistEl.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" || !event.target.matches(".add-item-row input")) return;
            addItem(Number(event.target.dataset.cat), event.target);
        });

        userSelect.addEventListener("change", () => {
            if (currentUser && userSelect.value !== currentUser) {
                currentUser = "";
                renderChecklist();
                setStatus("请输入密码后进入");
            }
            document.getElementById("loginPassword").focus();
        });

        document.getElementById("addUserBtn").addEventListener("click", addUser);
        document.getElementById("loginBtn").addEventListener("click", loginUser);
        document.getElementById("logoutBtn").addEventListener("click", logoutUser);
        document.getElementById("deleteUserBtn").addEventListener("click", deleteUser);
        document.getElementById("loginPassword").addEventListener("keydown", (event) => {
            if (event.key === "Enter") loginUser();
        });
        document.getElementById("newUserPassword2").addEventListener("keydown", (event) => {
            if (event.key === "Enter") addUser();
        });
        document.getElementById("addCategoryBtn").addEventListener("click", addCategory);
        document.getElementById("newCategoryName").addEventListener("keydown", (event) => {
            if (event.key === "Enter") addCategory();
        });

        function loadRace() {
            const dateInput = document.getElementById("raceDate");
            const districtSelect = document.getElementById("districtSelect");
            try {
                const saved = JSON.parse(localStorage.getItem(RACE_KEY));
                if (saved && saved.date) dateInput.value = saved.date;
                if (saved && DISTRICTS[saved.district]) districtSelect.value = saved.district;
            } catch (error) {
                dateInput.value = "2026-10-25";
                districtSelect.value = "北京房山区";
            }
        }

        function saveRace() {
            localStorage.setItem(RACE_KEY, JSON.stringify({
                date: document.getElementById("raceDate").value,
                district: document.getElementById("districtSelect").value
            }));
        }

        function weatherMessage(text) {
            document.getElementById("hourly").innerHTML = `<p class="weather-note">${esc(text)}</p>`;
        }

        async function loadWeather() {
            const date = document.getElementById("raceDate").value;
            const district = document.getElementById("districtSelect").value;
            const coords = DISTRICTS[district];
            saveRace();
            if (!date || !coords) {
                weatherMessage("请选择跑马日期和城区");
                return;
            }

            weatherMessage("正在读取当天 6:00–12:00 预报");
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&hourly=temperature_2m,weather_code,precipitation_probability&start_date=${date}&end_date=${date}&timezone=Asia%2FShanghai`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                const times = data.hourly && data.hourly.time;
                if (!times || !times.length) {
                    weatherMessage("这一天暂时没有预报");
                    return;
                }

                const hours = [];
                times.forEach((time, index) => {
                    const hour = Number(time.slice(11, 13));
                    if (hour >= 6 && hour <= 12) {
                        hours.push({
                            label: `${hour}:00`,
                            temp: Math.round(data.hourly.temperature_2m[index]),
                            code: data.hourly.weather_code[index],
                            rain: data.hourly.precipitation_probability[index]
                        });
                    }
                });

                if (!hours.length) {
                    weatherMessage("这一天暂时没有 6:00–12:00 的预报");
                    return;
                }

                document.getElementById("hourly").innerHTML = hours.map((hour) => `
                    <div class="hour">
                        <div class="hour-time">${hour.label}</div>
                        <div class="hour-icon">${WEATHER_ICONS[hour.code] || "🌤️"}</div>
                        <div class="hour-temp">${hour.temp}°</div>
                        <div class="hour-rain">${hour.rain == null ? "" : `${hour.rain}%`}</div>
                    </div>
                `).join("");
            } catch (error) {
                weatherMessage("暂时读不到预报");
            }
        }

        function exportSnapshot() {
            const date = document.getElementById("raceDate").value;
            const district = document.getElementById("districtSelect").value;
            const weather = [...document.querySelectorAll("#hourly .hour")].map((el) => ({
                time: el.querySelector(".hour-time").textContent,
                icon: el.querySelector(".hour-icon").textContent,
                temp: el.querySelector(".hour-temp").textContent,
                rain: el.querySelector(".hour-rain").textContent
            }));
            return {
                title: "亦起跑-马拉松清单",
                user: currentUser,
                date,
                district,
                weather,
                categories: currentCategories() || []
            };
        }

        function exportFileName(ext) {
            const date = document.getElementById("raceDate").value || "清单";
            return `亦起跑-马拉松清单-${currentUser}-${date}.${ext}`;
        }

        function exportHtml(data) {
            const weather = data.weather.length ? data.weather.map((hour) => `
                <div class="hour">
                    <div>${hour.time}</div>
                    <div class="icon">${hour.icon}</div>
                    <div>${hour.temp}</div>
                    <div class="rain">${hour.rain}</div>
                </div>`).join("") : `<p>暂无 6:00–12:00 预报</p>`;
            const lists = data.categories.map((category) => `
                <h2>${esc(category.name)}</h2>
                ${category.items.map((item) => `
                    <div class="item">
                        <span class="box ${item.checked ? "on" : ""}">${item.checked ? "✓" : ""}</span>
                        <span>${esc(item.name)}</span>
                    </div>`).join("")}
            `).join("");
            return `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>${esc(data.title)}</title>
<style>
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2430; margin: 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  .meta { font-size: 16px; margin-bottom: 12px; }
  .weather { display: flex; gap: 8px; margin-bottom: 16px; }
  .hour { border: 1px solid #e6eaf2; border-radius: 8px; padding: 6px 8px; text-align: center; font-size: 14px; }
  .icon { font-size: 20px; }
  .rain { color: #6d7c93; font-size: 13px; }
  h2 { font-size: 18px; background: #e23b4a; color: #fff; padding: 6px 10px; border-radius: 8px; }
  .item { display: flex; gap: 8px; align-items: flex-start; font-size: 16px; line-height: 1.35; margin: 6px 0; }
  .box { width: 18px; height: 18px; border: 2px solid #e23b4a; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; }
  .box.on { background: #1f9d55; border-color: #1f9d55; color: #fff; }
  @page { margin: 12mm; }
</style></head><body>
  <h1>${esc(data.title)}</h1>
  <div class="meta">${esc(data.user)}　${esc(data.date)}　${esc(data.district)}</div>
  <div class="weather">${weather}</div>
  ${lists}
</body></html>`;
        }

        function savePdf() {
            const categories = currentCategories();
            if (!categories) return;
            const frame = document.createElement("iframe");
            frame.style.position = "fixed";
            frame.style.right = "0";
            frame.style.bottom = "0";
            frame.style.width = "0";
            frame.style.height = "0";
            frame.style.border = "0";
            document.body.appendChild(frame);
            const doc = frame.contentDocument;
            doc.open();
            doc.write(exportHtml(exportSnapshot()));
            doc.close();
            setTimeout(() => {
                frame.contentWindow.focus();
                frame.contentWindow.print();
                setTimeout(() => frame.remove(), 1500);
            }, 250);
        }

        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            let line = "";
            for (const ch of text) {
                const next = line + ch;
                if (line && ctx.measureText(next).width > maxWidth) {
                    lines.push(line);
                    line = ch;
                } else {
                    line = next;
                }
            }
            if (line) lines.push(line);
            return lines.length ? lines : [""];
        }

        async function saveJpg() {
            const categories = currentCategories();
            if (!categories) return;
            await document.fonts.ready;
            const data = exportSnapshot();
            const width = 900;
            const pad = 36;
            const contentWidth = width - pad * 2;
            const font = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
            const measure = document.createElement("canvas").getContext("2d");
            measure.font = `20px ${font}`;
            let height = pad + 48 + 32 + 92;
            const boxSize = 22;
            const textLeft = pad + boxSize + 10;
            data.categories.forEach((category) => {
                height += 42;
                category.items.forEach((item) => {
                    const lines = wrapText(measure, item.name, width - textLeft - pad);
                    height += Math.max(boxSize, lines.length * 28) + 8;
                });
            });
            height += pad;

            const canvas = document.createElement("canvas");
            const scale = 2;
            canvas.width = width * scale;
            canvas.height = height * scale;
            const ctx = canvas.getContext("2d");
            ctx.scale(scale, scale);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = "#1f2430";
            ctx.font = `bold 32px ${font}`;
            ctx.fillText(data.title, pad, pad + 28);
            ctx.font = `18px ${font}`;
            ctx.fillStyle = "#4d5668";
            ctx.fillText(`${data.user}    ${data.date}    ${data.district}`, pad, pad + 62);

            let x = pad;
            const weatherY = pad + 84;
            ctx.font = `16px ${font}`;
            if (!data.weather.length) {
                ctx.fillText("暂无 6:00–12:00 预报", pad, weatherY + 28);
            }
            data.weather.forEach((hour) => {
                ctx.fillStyle = "#f7f9fc";
                ctx.fillRect(x, weatherY, 108, 78);
                ctx.fillStyle = "#667085";
                ctx.font = `14px ${font}`;
                ctx.fillText(hour.time, x + 8, weatherY + 20);
                ctx.font = `22px ${font}`;
                ctx.fillStyle = "#1f2430";
                ctx.fillText(hour.icon, x + 8, weatherY + 46);
                ctx.font = `16px ${font}`;
                ctx.fillText(`${hour.temp}  ${hour.rain}`, x + 40, weatherY + 46);
                x += 116;
            });

            let y = weatherY + 102;
            data.categories.forEach((category) => {
                ctx.fillStyle = "#e23b4a";
                ctx.fillRect(pad, y, contentWidth, 32);
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold 18px ${font}`;
                ctx.fillText(category.name, pad + 10, y + 22);
                y += 42;
                category.items.forEach((item) => {
                    ctx.save();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = item.checked ? "#1f9d55" : "#e23b4a";
                    ctx.fillStyle = item.checked ? "#1f9d55" : "#ffffff";
                    ctx.beginPath();
                    ctx.roundRect(pad, y, boxSize, boxSize, 6);
                    ctx.fill();
                    ctx.stroke();
                    if (item.checked) {
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 2.5;
                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";
                        ctx.beginPath();
                        ctx.moveTo(pad + 5, y + 11);
                        ctx.lineTo(pad + 9, y + 16);
                        ctx.lineTo(pad + 17, y + 6);
                        ctx.stroke();
                    }
                    ctx.restore();
                    ctx.font = `20px ${font}`;
                    ctx.fillStyle = "#1f2430";
                    const lines = wrapText(ctx, item.name, width - textLeft - pad);
                    lines.forEach((line, index) => {
                        ctx.fillText(line, textLeft, y + 18 + index * 28);
                    });
                    y += Math.max(boxSize, lines.length * 28) + 8;
                });
            });

            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/jpeg", 0.92);
            link.download = exportFileName("jpg");
            link.click();
        }

        document.getElementById("pdfBtn").addEventListener("click", savePdf);
        document.getElementById("jpgBtn").addEventListener("click", saveJpg);

        document.getElementById("raceDate").addEventListener("change", loadWeather);
        document.getElementById("districtSelect").addEventListener("change", loadWeather);

        async function boot() {
            renderChecklist();
            loadRace();
            loadWeather();
            setStatus("正在读取用户");
            try {
                await migrateLocalUsers();
                await refreshUserList();
                setStatus("");
            } catch (error) {
                setStatus("暂时连不上服务器", "error");
            }
            renderChecklist();
        }

        boot();
    </script>
</body>
</html>
